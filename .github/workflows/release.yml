# Release automation.
#
# 1. release-please watches master. From Conventional Commits it opens (and keeps
#    updating) a "release PR" that bumps lib/wordmove/version.rb and CHANGELOG.md.
#    Merging that PR creates the vX.Y.Z tag and the GitHub release, using the
#    RELEASE_PLEASE_TOKEN PAT so that the tag push triggers this workflow again.
# 2. That tag push runs the publish job, which builds the gem, pushes it to
#    rubygems.org with trusted publishing (OIDC, no API key) and attaches the
#    .gem to the release. A v* tag pushed by hand at the head of master goes
#    through the same job.
#
# One-time setup (see README "Releasing"):
#   - rubygems.org: pending trusted publisher for gem wordmove-ng, repository
#     tekgnosis-net/wordmove-ng, workflow release.yml, environment release
#   - GitHub: environment "release"; Actions setting "Allow GitHub Actions to
#     create and approve pull requests" enabled; repository secret
#     RELEASE_PLEASE_TOKEN holding a fine-grained PAT scoped to this repository
#     with Contents and Pull requests read/write (so release PRs run the checks
#     that branch protection requires)

name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.ref == 'refs/heads/master' && github.event_name != 'workflow_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A fine-grained PAT (secret RELEASE_PLEASE_TOKEN, contents + pull-requests
      # read/write) instead of the built-in token: PRs opened with the built-in
      # token never trigger the Tests workflow, which the branch protection on
      # master requires before a release PR can be merged.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    # Only on tag pushes. release-please's tag (created with the PAT) triggers
    # this workflow like any other push, so publishing from the master run as
    # well would race it and fail with "Tag vX.Y.Z has already been created".
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # upload the .gem to the GitHub release
      id-token: write   # rubygems.org trusted publishing
    steps:
      # `rake release` (run by release-gem) tags and pushes, so it needs a real
      # branch checkout, not a detached tag.
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify the tag points at the head of master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --tags --force
          tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::$TAG points at $tag_commit but master is at $head_commit; tag the head of master."
            exit 1
          fi
          version="$(ruby -Ilib -e 'require "wordmove/version"; print Wordmove::VERSION')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::lib/wordmove/version.rb says $version but the tag is $TAG."
            exit 1
          fi

      - name: Run the test suite once more on the release commit
        run: bundle exec rake

      - name: Build and push the gem to rubygems.org
        uses: rubygems/release-gem@v1

      - name: Attach the gem to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # release-please creates the release itself; a hand-pushed tag has none yet.
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md for details."
          fi
          gh release upload "$TAG" pkg/*.gem --clobber
